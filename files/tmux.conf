# basic config
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# mouse support (wheel handling is configured at the bottom of this file)
set -g mouse on

set -g default-terminal "tmux-256color"
# Truecolor (RGB) passthrough — must target the OUTER terminal's $TERM.
set -as terminal-features ",xterm-256color:RGB"
# Enable OSC 8 hyperlink support (allows URLs to remain clickable even when wrapped across lines)
set -as terminal-features ",*:hyperlinks"

# Automatically update tmux's environment with these variables
set -g update-environment "SSH_AUTH_SOCK SSH_AGENT_PID"

run '~/.config/tmux/plugins/tpm/tpm'

# --- Mouse-wheel: scroll the right thing depending on what owns the pane ---
# Three cases, in order:
#   1. App actively grabs the mouse (Claude Code, vim w/ mouse, fzf): forward
#      the wheel as-is so it scrolls its own buffer.
#   2. Mouse-naive full-screen app on the alternate screen (less, man, the git
#      pager): it keeps no tmux scrollback (~1 line) and ignores mouse events,
#      but responds to arrow keys — so translate the wheel into Up/Down.
#   3. Plain shell: fall back to tmux copy-mode scrollback.
bind -n WheelUpPane {
    if -F '#{mouse_any_flag}' {
        send -M
    } {
        if -F '#{alternate_on}' {
            send -N3 Up
        } {
            copy-mode -e
            send -X -N3 scroll-up
        }
    }
}
bind -n WheelDownPane {
    if -F '#{mouse_any_flag}' {
        send -M
    } {
        if -F '#{alternate_on}' {
            send -N3 Down
        } {
            send -X -N3 scroll-down
        }
    }
}
