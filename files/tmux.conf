# basic config
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# mouse support (wheel handling is configured at the bottom of this file)
set -g mouse on

set -g default-terminal "tmux-256color"
# Truecolor (RGB) passthrough — must target the OUTER terminal's $TERM.
set -as terminal-features ",xterm-256color:RGB"
# Enable OSC 8 hyperlink support (allows URLs to remain clickable even when wrapped across lines)
set -as terminal-features ",*:hyperlinks"

# Automatically update tmux's environment with these variables
set -g update-environment "SSH_AUTH_SOCK SSH_AGENT_PID"

run '~/.config/tmux/plugins/tpm/tpm'

# --- Mouse-wheel: let mouse-aware apps scroll themselves, else copy-mode ---
# Apps on the alternate screen (Claude Code, vim, less, fzf, …) request mouse
# tracking and scroll their OWN buffer — tmux keeps no scrollback for them
# (history_size stays ~1). So forward the wheel to them. Only fall back to
# tmux copy-mode scrollback when no app has grabbed the mouse (plain shell).
bind -n WheelUpPane {
    if -F '#{mouse_any_flag}' {
        send -M
    } {
        copy-mode -e
        send -X -N3 scroll-up
    }
}
bind -n WheelDownPane {
    if -F '#{mouse_any_flag}' {
        send -M
    } {
        send -X -N3 scroll-down
    }
}
