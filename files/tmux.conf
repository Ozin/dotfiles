# basic config
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# theme — Catppuccin (Mocha) to match ghostty
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'mocha'

# proper mouse scrolling support
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g mouse on

set -g default-terminal "tmux-256color"
# Truecolor (RGB) passthrough — must target the OUTER terminal's $TERM.
# Ghostty reports xterm-ghostty; without this tmux degrades Catppuccin's hex
# colors to the 256-color palette and they render wrong.
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
# Enable OSC 8 hyperlink support (allows URLs to remain clickable even when wrapped across lines)
set -as terminal-features ",*:hyperlinks"

# Automatically update tmux's environment with these variables
set -g update-environment "SSH_AUTH_SOCK SSH_AGENT_PID"

run '~/.config/tmux/plugins/tpm/tpm'

# --- Catppuccin status line (configured after the plugin is loaded above) ---
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_session}"
