---
# Replaces GNU Stow — places all config files via symlink

- name: Ensure target directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home_dir }}/.local/bin"
    - "{{ home_dir }}/.git-hooks"
    - "{{ home_dir }}/.oh-my-zsh/custom"
    - "{{ home_dir }}/.oh-my-zsh/custom/plugins/gstale"
    - "{{ home_dir }}/.config/tmux"
    - "{{ home_dir }}/.config/k9s/skins"
    - "{{ home_dir }}/.config/dprint"

# --- zsh ---

- name: Symlink .zshrc
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/zshrc"
    dest: "{{ home_dir }}/.zshrc"
    state: link
    force: true

# --- git ---

- name: Symlink .gitconfig
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/gitconfig"
    dest: "{{ home_dir }}/.gitconfig"
    state: link
    force: true

- name: Symlink global .gitignore
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/gitignore_global"
    dest: "{{ home_dir }}/.gitignore"
    state: link
    force: true

- name: Symlink git commit-msg hook
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/git-hooks/commit-msg"
    dest: "{{ home_dir }}/.git-hooks/commit-msg"
    state: link
    force: true

# --- omz plugins ---

- name: Symlink OMZ custom aliases
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/omz-plugins/aliases.zsh"
    dest: "{{ home_dir }}/.oh-my-zsh/custom/aliases.zsh"
    state: link
    force: true

- name: Symlink gstale plugin
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/omz-plugins/plugins/gstale/gstale.plugin.zsh"
    dest: "{{ home_dir }}/.oh-my-zsh/custom/plugins/gstale/gstale.plugin.zsh"
    state: link
    force: true

# --- bin scripts ---

- name: Symlink bin scripts
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/bin/{{ item }}"
    dest: "{{ home_dir }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - pbcopy
    - pbpaste
    - wslopen
    - xdg-open

# --- tmux ---

- name: Symlink tmux.conf
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/tmux.conf"
    dest: "{{ home_dir }}/.config/tmux/tmux.conf"
    state: link
    force: true

# --- k9s ---

- name: Symlink k9s config files
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/k9s/{{ item }}"
    dest: "{{ home_dir }}/.config/k9s/{{ item }}"
    state: link
    force: true
  loop:
    - config.yaml
    - aliases.yaml

- name: Symlink k9s nord skin
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/k9s/skins/nord.yaml"
    dest: "{{ home_dir }}/.config/k9s/skins/nord.yaml"
    state: link
    force: true

# --- dprint ---

- name: Symlink dprint config
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/dprint/dprint.jsonc"
    dest: "{{ home_dir }}/.config/dprint/dprint.jsonc"
    state: link
    force: true
