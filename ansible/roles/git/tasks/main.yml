---
- name: Ensure projects/private directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/projects/private"
    state: directory
    mode: "0755"

- name: Symlink private git context
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/git-contexts/private.gitconfig"
    dest: "{{ home_dir }}/projects/private/.gitconfig"
    state: link
    force: true

- name: Discover git context directories
  ansible.builtin.find:
    paths: "{{ home_dir }}/projects"
    patterns: ".gitconfig"
    file_type: any
    depth: 2
  register: git_context_files

- name: Generate ~/.gitconfig-contexts from discovered contexts
  ansible.builtin.copy:
    content: |
      {% for f in git_context_files.files %}
      [includeIf "gitdir:{{ f.path | dirname }}/"]
      	path = {{ f.path }}

      {% endfor %}
    dest: "{{ home_dir }}/.gitconfig-contexts"
    mode: "0644"
