---
# Packages with the same name on every supported distro.
common_packages:
  - bat
  - coreutils
  - curl
  - diffutils
  - findutils
  - fontconfig
  - gcc
  - golang
  - grep
  - gzip
  - highlight
  - jq
  - make
  - mkcert
  - podman
  - ripgrep
  - tmux
  - tree
  - unzip
  - xclip
  - zip
  - zsh

# Packages whose name (or presence) differs by package-manager family.
# debian: gnupg, python venv shipped separately.
# redhat: gnupg2, venv bundled in python3, fuse-libs for the Neovim AppImage.
package_overrides:
  debian:
    - gnupg
    - python3.12-venv
  redhat:
    - gnupg2
    - python3
    - fuse-libs

# WSL-only packages, by package-manager family (X11 utils only matter under WSL).
wsl_packages_by_os:
  debian:
    - wslu
    - x11-apps
  redhat: []

system_packages: "{{ common_packages + package_overrides[pkg_family] }}"
wsl_packages: "{{ wsl_packages_by_os[pkg_family] }}"
